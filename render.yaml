services:
  # ─── 1. Backend Web Service (Node.js REST API) ──────────────────────
  - type: web
    name: kootaflow-production-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --workspace=@kootaflow/backend
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_uDQg2k6JHARv@ep-weathered-wind-ab7o9vmz-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&connect_timeout=20
      - key: DIRECT_URL
        value: postgresql://neondb_owner:npg_uDQg2k6JHARv@ep-weathered-wind-ab7o9vmz.eu-west-2.aws.neon.tech/neondb?sslmode=require&connect_timeout=20
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://kootaflow-66mf.onrender.com,https://kootaflow-client-nz3v.onrender.com,https://kootaflow-client.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_EMAIL
        value: admin@kootaflow.com
      - key: ADMIN_PASSWORD
        generateValue: true

  # ─── 2. Frontend Static Site (React/Vite SPA) ────────────────────────
  - type: web
    name: kootaflow-66mf
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@kootaflow/frontend
    staticPublishPath: frontend/dist
    autoDeploy: true
    # SPA routing: rewrite all paths to /index.html for client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kootaflow-production-api.onrender.com/api
