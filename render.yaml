services:
  # ─── 1. Backend Web Service (Node.js REST API) ──────────────────────
  - type: web
    name: kootaflow
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --workspace=@kootaflow/backend
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://kootaflow-client-nz3v.onrender.com,https://kootaflow-client.onrender.com,https://kootaflow.onrender.com,http://localhost:5173
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_EMAIL
        value: admin@kootaflow.com
      - key: ADMIN_PASSWORD
        generateValue: true

  # ─── 2. Frontend Static Site (React/Vite SPA) ────────────────────────
  - type: web
    name: kootaflow-client
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@kootaflow/frontend
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kootaflow.onrender.com/api

