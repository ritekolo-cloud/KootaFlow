services:
  - type: web
    name: kootaflow
    env: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://kootaflow.onrender.com,https://kootaflow-client.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_EMAIL
        value: admin@kootaflow.com
      - key: ADMIN_PASSWORD
        generateValue: true
